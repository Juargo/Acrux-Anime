name: Deploy

# Production of the `app` project (ADR-0027). Runs only after CI passes on a push to main:
# migrations first, then the prebuilt deploy, then a smoke test that rolls back on failure.
# Git deploys of main are off in apps/web/vercel.json, so this is the only way to production.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_smoke_failure:
        description: Make the smoke test fail on purpose to prove the automatic rollback
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A deploy waiting for approval holds the deploy-production group, so one that nobody
  # approves keeps every later deploy pending. Only the newest commit should ask for
  # approval: older runs still waiting are cancelled. A run in that state has not started
  # its deploy job, so nothing that already runs against production is ever cancelled.
  supersede:
    name: Cancel older deploys waiting for approval
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older runs of this workflow that wait for approval
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --status waiting \
            --limit 100 --json databaseId --jq '.[].databaseId' |
            while read -r run; do
              if [ "$run" -lt "$THIS_RUN" ]; then
                echo "Cancelling deploy run $run, superseded by $THIS_RUN"
                gh run cancel "$run" --repo "$GITHUB_REPOSITORY"
              fi
            done

  deploy:
    name: Migrate, deploy and smoke test
    needs: supersede
    runs-on: ubuntu-latest
    # One deploy at a time, and a deploy that started is never cancelled. The group is on
    # the job, not on the workflow, so `supersede` runs while another deploy holds it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Holds the production secrets and requires the stakeholder's approval.
    environment:
      name: deploy-production
      url: https://app.acruxanime.com
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@65.1.0
      PRODUCTION_URL: https://app.acruxanime.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Migrations are backwards compatible (ADR-0022), so they go before the code.
      # If they fail, the job stops here and production keeps the previous code.
      - name: Apply database migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: pnpm --filter @acrux/api db:deploy

      - name: Build
        # With the token, the SPA build uploads its source maps to Sentry and removes them.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Remember the current production deployment
        id: previous
        # Without it there is nothing to roll back to, so the job stops before deploying.
        run: |
          id=$(.github/scripts/vercel-production.sh current)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        run: |
          url=$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -1)
          id=$(.github/scripts/vercel-production.sh deployment-id "$url")
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # After an Instant Rollback, Vercel stops assigning the production domain to new
      # deployments until one is promoted. Promote explicitly and wait until production
      # serves it, so the smoke test never passes against the old deployment.
      - name: Promote and confirm the production domain
        env:
          NEW_DEPLOYMENT: ${{ steps.deploy.outputs.id }}
        run: .github/scripts/vercel-production.sh promote "$NEW_DEPLOYMENT"

      - name: Smoke test
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_smoke_failure }}
        run: |
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "Simulated smoke test failure (workflow_dispatch input)." >&2
            exit 1
          fi
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "$PRODUCTION_URL/api/health" \
            | grep -q '"status":"ok"'
          # The root document must come from api/html with a nonce, never from a static file.
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 -D - -o /dev/null "$PRODUCTION_URL/" \
            | grep -i "^content-security-policy:.*'nonce-" > /dev/null

      - name: Roll back
        if: failure() && steps.deploy.outcome != 'skipped' && steps.previous.outputs.id != ''
        env:
          PREVIOUS_DEPLOYMENT: ${{ steps.previous.outputs.id }}
        run: .github/scripts/vercel-production.sh rollback "$PREVIOUS_DEPLOYMENT"
