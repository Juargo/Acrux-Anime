name: Preview database

# The PR previews of `app` use the Neon branch `dev` (S6 of odd/tasks/esquema-prisma-inicial.md)
# and only Deploy migrates production, so a PR that adds a migration had a broken preview until
# someone ran `db:deploy` on `dev` by hand. This applies the PR's migrations to `dev`.
# Migrations are backwards compatible (ADR-0022): one from a PR that never merges stays on `dev`
# without breaking the other previews.
on:
  pull_request:
    paths:
      - apps/api/prisma/migrations/**

# One run per PR; a newer push of the same PR waits. Runs of different PRs may overlap:
# `prisma migrate deploy` takes a Postgres advisory lock, so they still apply one at a time.
concurrency:
  group: preview-db-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate the preview database
    # Public repository: fork PRs get no secrets (ADR-0027), so only branches of this
    # repository migrate `dev`.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Holds DATABASE_URL_UNPOOLED of the Neon branch `dev` (owner role), never production's.
    environment: preview-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Refuses production (its endpoint is known), the pooler (migrations need a direct
      # connection) and any host that is not the dev branch.
      - name: Check the target is the dev branch
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          host="$(node -e 'console.log(new URL(process.env.DATABASE_URL_UNPOOLED).hostname)')"
          case "$host" in
            ep-round-snow-b5mftgmf*) echo "::error::DATABASE_URL_UNPOOLED points to production"; exit 1 ;;
            *-pooler*) echo "::error::DATABASE_URL_UNPOOLED must not use the pooler"; exit 1 ;;
            ep-calm-night-b59xx395*) echo "Target: Neon branch dev" ;;
            *) echo "::error::Unknown database host"; exit 1 ;;
          esac

      - name: Apply database migrations to dev
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: pnpm --filter @acrux/api db:deploy
