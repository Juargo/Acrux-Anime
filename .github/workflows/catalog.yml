name: Catalog

# Weekly load of the catalog from MyAnimeList into production (ADR-0043, point 3). It lists
# every anime again and reads the detail, relations included, of the ones that lack it or
# have the oldest one. Requests go one per second and the job stops at the first refusal,
# so it does not burden MyAnimeList. The environment has no reviewers, because a scheduled
# job must not wait for a human, and only main can use it. Its database secret belongs to
# the acrux_catalog role, which only reaches the catalog table.
on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:
    inputs:
      details:
        description: "Detalles a leer en esta corrida (uno por segundo)"
        required: false
        default: "6000"

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  load:
    name: Load the catalog
    runs-on: ubuntu-24.04
    environment: catalog-production
    # 16000 details at one per second take about four and a half hours.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load the catalog
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_CATALOG }}
          DETAILS: ${{ inputs.details || '6000' }}
        run: pnpm --filter @acrux/api catalog:load "--details=$DETAILS"
