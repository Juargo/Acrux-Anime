name: Weekly

# Weekly DAST (ADR-0018, ADR-0027). The PR previews sit behind Vercel Authentication and
# main has no previews (it deploys from Deploy), so the passive baseline scans production.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://app.acruxanime.com
          allow_issue_writing: true
          issue_title: "ZAP baseline: hallazgos en app.acruxanime.com"
