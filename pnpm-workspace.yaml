packages:
  - "apps/*"
  - "packages/*"

# Paquetes con scripts de instalación permitidos (pnpm 11 los bloquea por defecto).
allowBuilds:
  "@prisma/engines": true
  core-js: false
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false

# Defensas de instalación. pnpm 11 lee estos ajustes de este archivo, no de `.npmrc`.
# minimumReleaseAge: no instala versiones publicadas hace menos de 7 días (10080 minutos).
minimumReleaseAge: 10080
auditLevel: high
blockExoticSubdeps: true

# Parches de dependencias transitivas con vulnerabilidades altas (pnpm audit).
overrides:
  # @neon/auth 0.8.0 pins better-auth 1.7.6, with critical advisories fixed in 1.7.7.
  # Remove these once @neon/auth 0.8.2 (better-auth ~1.7.12) leaves the quarantine (#28).
  better-auth: 1.7.14
  "@better-auth/core": 1.7.14
  "@better-auth/oauth-provider": 1.7.14
  better-call: 1.4.4
  "@vercel/routing-utils>path-to-regexp": ^6.3.0
  "@vercel/cli-config>zod": ^4.6.6
