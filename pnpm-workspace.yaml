packages:
  - "apps/*"
  - "packages/*"

# Paquetes con scripts de instalación permitidos (pnpm 11 los bloquea por defecto).
allowBuilds:
  "@prisma/engines": true
  core-js: false
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false

# Defensas de instalación. pnpm 11 lee estos ajustes de este archivo, no de `.npmrc`.
# minimumReleaseAge: no instala versiones publicadas hace menos de 7 días (10080 minutos).
minimumReleaseAge: 10080
auditLevel: high
blockExoticSubdeps: true

# Parches de dependencias transitivas con vulnerabilidades altas (pnpm audit).
overrides:
  "@vercel/routing-utils>path-to-regexp": ^6.3.0
  "@vercel/cli-config>zod": ^4.6.6
